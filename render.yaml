databases:
  - name: minimachines-db
    plan: free
    databaseName: minimachines
    user: minimachines

services:
  - type: web
    name: minimachines-store
    runtime: python
    plan: free
    rootDir: app
    buildCommand: bash build.sh
    startCommand: gunicorn app.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: minimachines-db
          property: connectionString
